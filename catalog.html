<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Коллекция часов NOIR: модели с ручным заводом, автоматическим и кварцевым механизмом.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Каталог — NOIR">
  <meta property="og:description"
    content="Коллекция часов NOIR: модели с ручным заводом, автоматическим и кварцевым механизмом.">
  <title>Каталог — NOIR</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/data.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/catalog.js" defer></script>
</head>

<body id="top">
  <a class="skip-link" href="#main">Перейти к основному содержимому</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html" aria-label="NOIR — главная">NOIR</a>

      <button class="menu-toggle button button--secondary" type="button" aria-expanded="false"
        aria-controls="site-navigation" hidden>Меню <span aria-hidden="true">＋</span></button>
      <nav class="site-nav" id="site-navigation" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link site-nav__link--active" aria-current="page"
              href="catalog.html">Каталог</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="cart.html">Корзина</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="order.html">Заявка</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="site-main" id="main" tabindex="-1">

    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a class="breadcrumbs__link" href="index.html">Главная</a>
      <span class="breadcrumbs__current" aria-current="page">Каталог</span>
    </nav>

    <section class="section">
      <h1 class="section__title">Коллекция часов</h1>
    </section>

    <section class="catalog-layout" aria-labelledby="catalog-products-title">
      <aside class="catalog-filters">
        <details class="filter-disclosure" open>
          <summary>Подобрать часы <span aria-hidden="true">＋</span></summary>
          <h2 class="catalog-filters__title">Фильтры</h2>
          <label for="catalog-search">Найти модель</label>
          <input class="catalog-filters__input" id="catalog-search" type="search"
            placeholder="Введите название товара" autocomplete="off">

          <label for="category-filter">Категория</label>
          <select class="catalog-filters__input" id="category-filter">
            <option value="all">Все категории</option>
            <option value="Ручной завод">Ручной завод</option>
            <option value="Автоматический механизм">Автоматический механизм</option>
            <option value="Кварцевый механизм">Кварцевый механизм</option>
          </select>
        </details>
      </aside>

      <section class="catalog-layout__products">
        <h2 class="catalog-layout__title" id="catalog-products-title">Модели часов</h2>
        <div class="catalog-toolbar">
          <p class="catalog-count" aria-live="polite"></p>
          <div>
            <label for="sort-select">Сортировка</label>
            <select class="catalog-filters__input" id="sort-select">
              <option value="default">По умолчанию</option>
              <option value="price-asc">Сначала дешевле</option>
              <option value="price-desc">Сначала дороже</option>
              <option value="title-asc">По названию А-Я</option>
            </select>
          </div>
        </div>
        <p class="catalog-empty" hidden>По выбранным условиям товары не найдены.</p>
        <p id="cart-message" role="status"></p>
        <div class="products-grid" data-products-container></div>
      </section>
    </section>
    <template id="catalog-gallery">
      <div class="watch-gallery" role="group" aria-roledescription="карусель">
        <img class="product-card__image" sizes="(min-width: 900px) 480px, calc(100vw - 64px)"
          alt="" width="640" height="640" loading="lazy">
        <div class="watch-gallery__controls"><button class="watch-gallery__arrow" type="button" data-step="-1"
            aria-label="Предыдущий ракурс"><svg class="watch-gallery__icon" aria-hidden="true" focusable="false"
              xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <span class="watch-gallery__status" aria-live="polite" aria-atomic="true">Спереди · 1 / 3</span>
          <button class="watch-gallery__arrow" type="button" data-step="1" aria-label="Следующий ракурс"><svg
              class="watch-gallery__icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"
              width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </div>
      </div>
    </template>
  </main>
  <footer class="site-footer">
    <div class="site-footer__inner">
      <p class="site-footer__text">&copy; 2026 NOIR · Учебный магазин винтажных часов</p>
      <a href="index.html#delivery">Доставка и возврат</a><a href="contacts.html">Связаться с нами</a>
    </div>
  </footer>
  <a class="back-to-top" href="#top" aria-label="Наверх">↑</a>

</body>

</html>
